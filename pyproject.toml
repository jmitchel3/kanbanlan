[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kanbanlan"
version = "0.9.0"
description = "Repository-native request coordination for humans and coding agents."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Justin Mitchel" },
]
keywords = ["cli", "github", "kanban", "project-management", "coding-agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/jmitchel3/kanbanlan"
Documentation = "https://github.com/jmitchel3/kanbanlan#readme"
Issues = "https://github.com/jmitchel3/kanbanlan/issues"
Source = "https://github.com/jmitchel3/kanbanlan"

[project.scripts]
kanbanlan = "kanbanlan.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kanbanlan"]

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
