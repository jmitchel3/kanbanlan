# Generated by kanbanlan; run `kanbanlan init` to refresh.
name: Work request
description: Capture one independently reviewable outcome.
title: "[Request] "
labels:
  - "status:intake"
body:
  - type: markdown
    attributes:
      value: |
        One card is one outcome and, while active, belongs to one session.
        `kanbanlan reconcile --apply` assigns its portable Kanbanlan ID.

  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: Describe the user-visible or operational result.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Include relevant evidence, decisions, and links.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: "- [ ] ..."
    validations:
      required: true

  - type: textarea
    id: boundaries
    attributes:
      label: Scope boundaries
      description: State what is in and out of scope.
    validations:
      required: true

  - type: textarea
    id: touchpoints
    attributes:
      label: Likely touchpoints
      description: Name behaviors, contracts, migrations, shared UI, docs, and likely paths.
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and overlap
      description: Link cards or PRs that block, precede, or may collide with this request.
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0 - incident or release blocker
        - P1 - next up
        - P2 - planned
        - P3 - later
      default: 2
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Name the automated and manual evidence expected before merge.
    validations:
      required: true
